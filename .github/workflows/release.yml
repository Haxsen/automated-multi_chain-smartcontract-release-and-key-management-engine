name: release

# Tag push  -> testnet release (automatic, still gated by the `testnet` Environment)
# Dispatch  -> testnet or mainnet; `mainnet` Environment requires reviewers + tag refs
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      profile:
        description: Release profile (a GitHub Environment of the same name gates it)
        type: choice
        options: [testnet, mainnet]
        default: testnet
      dry_run:
        description: Simulate only - broadcast nothing
        type: boolean
        default: false

permissions: {}

concurrency:
  # One release per environment at a time: parallel runs would race on the deployer nonce.
  group: release-${{ inputs.profile || 'testnet' }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] - documented local reusable-workflow form
    permissions:
      contents: read
      security-events: write

  release:
    name: Release -> ${{ inputs.profile || 'testnet' }}
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: ${{ inputs.profile || 'testnet' }}
    permissions:
      contents: read
      id-token: write # OIDC: AWS role assumption + Sigstore keyless signing
    env:
      PROFILE: ${{ inputs.profile || 'testnet' }}
      DRY_RUN: ${{ inputs.dry_run || false }}
      PYTHONPATH: engine
      CONFTEST_IMAGE: openpolicyagent/conftest@sha256:0e77cdf7c1fcde035f3c579e4aaa6664ee2a8be5777eaa9af9f520cdd02280c0 # v0.71.1
      # GitHub Environment *variables* - identifiers, not secrets. There are no GitHub
      # secrets at all: credentials come from OIDC, RPC/API keys from Secrets Manager.
      RELEASE_OWNER: ${{ vars.RELEASE_OWNER }}
      EXPECTED_DEPLOYER: ${{ vars.EXPECTED_DEPLOYER }}
      AWS_KMS_KEY_ID: ${{ vars.AWS_KMS_KEY_ID }}
      RELEASE_SECRET_ID: ${{ vars.RELEASE_SECRET_ID }}
    outputs:
      manifest: ${{ steps.release.outputs.manifest }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit # switch to `block` + allowed-endpoints once the baseline is known

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags are needed for the require_tag guardrail
          submodules: recursive
          persist-credentials: false

      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.9.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install engine runtime dependencies (hash-pinned)
        run: python -m pip install --require-hashes -r engine/requirements-aws.lock

      - name: Plan
        run: python -m release_engine plan --profile "$PROFILE" --out release-plan.json

      - name: Policy gate (OPA) - evaluated before any credential exists
        run: docker run --rm -v "$PWD:/repo" -w /repo "$CONFTEST_IMAGE" test --policy policy/release --namespace release release-plan.json

      - name: Assume environment-scoped release role (OIDC, 1h, no stored keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: release-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600

      - name: Release - sign in KMS, verify bytecode/owner/source, record
        id: release
        run: |
          args=(release --profile "$PROFILE")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python -m release_engine "${args[@]}"

      - name: Install cosign
        if: always() && steps.release.outputs.manifest != ''
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign manifest (Sigstore keyless, bound to this workflow's identity)
        if: always() && steps.release.outputs.manifest != ''
        env:
          MANIFEST: ${{ steps.release.outputs.manifest }}
        run: cosign sign-blob --yes --bundle "${MANIFEST}.sigstore.json" "$MANIFEST"

      - name: Append records to the immutable ledger (S3 Object Lock)
        if: always() && steps.release.outputs.manifest != '' && vars.DEPLOYMENT_LEDGER_BUCKET != ''
        env:
          MANIFEST: ${{ steps.release.outputs.manifest }}
          BUCKET: ${{ vars.DEPLOYMENT_LEDGER_BUCKET }}
        run: |
          dir="$(dirname "$MANIFEST")"
          version="$(basename "$dir")"
          aws s3 cp "$dir" "s3://${BUCKET}/${PROFILE}/${version}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/" \
            --recursive --sse aws:kms --only-show-errors

      - name: Upload deployment records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-records
          path: |
            deployments/
            release-plan.json
          if-no-files-found: warn
          retention-days: 90

  record:
    # Separate job, separate permissions: it can write to the repo but holds no AWS
    # credentials, and the signing job above cannot push code.
    name: Open PR with deployment records
    needs: release
    if: success() && inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      PROFILE: ${{ inputs.profile || 'testnet' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked] - needed to push the records branch; no artifacts are uploaded from this job

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deployment-records
          path: records

      - name: Commit records and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST: ${{ needs.release.outputs.manifest }}
        run: |
          version="$(basename "$(dirname "$MANIFEST")")"
          branch="deployments/${PROFILE}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          mkdir -p deployments
          cp -R "records/deployments/${PROFILE}" deployments/
          git add "deployments/${PROFILE}"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(deployments): record ${PROFILE} release (run ${GITHUB_RUN_ID})"
          git push origin "$branch"
          gh pr create --base "${GITHUB_REF_NAME:-main}" --head "$branch" \
            --title "Deployment records: ${PROFILE} (run ${GITHUB_RUN_ID})" \
            --body-file "deployments/${PROFILE}/${version}/summary.md"
