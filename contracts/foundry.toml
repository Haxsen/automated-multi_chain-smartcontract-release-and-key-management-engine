[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Pinned compiler + settings => byte-identical init code on every machine and chain,
# which is what makes the CREATE2 address identical across Ethereum/Arbitrum/Optimism.
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
auto_detect_solc = false
bytecode_hash = "ipfs"

# The deploy script may only write its result file; nothing else on disk.
fs_permissions = [{ access = "read-write", path = "./release-out" }]

# The RPC URL is injected by the release engine through the environment so provider API
# keys never appear on the command line (`forge script --rpc-url release`).
[rpc_endpoints]
release = "${RELEASE_RPC_URL}"

[fuzz]
runs = 1_000

[invariant]
runs = 256
depth = 64
fail_on_revert = true

# `FOUNDRY_PROFILE=ci` – heavier fuzzing in the pipeline.
[profile.ci.fuzz]
runs = 10_000

[profile.ci.invariant]
runs = 512
depth = 128

[fmt]
line_length = 100
